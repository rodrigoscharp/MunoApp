<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo verde gastro com cantos arredondados -->
  <rect width="64" height="64" rx="14" ry="14" fill="#1F3F34"/>

  <!-- Letra M em terracota — bold, ocupa bem o espaço -->
  <path fill="#C6562A" d="
    M 8 52
    L 8 14
    Q 8 10 12 10
    L 16 10
    Q 19 10 21 13
    L 32 34
    L 43 13
    Q 45 10 48 10
    L 52 10
    Q 56 10 56 14
    L 56 52
    Q 56 56 52 56
    L 49 56
    Q 45 56 45 52
    L 45 28
    L 36 47
    Q 34 50 32 50
    Q 30 50 28 47
    L 19 28
    L 19 52
    Q 19 56 15 56
    L 12 56
    Q 8 56 8 52
    Z
  "/>

  <!-- Pequeno garfo branco — detalhe da marca -->
  <g fill="white" opacity="0.90">
    <!-- Cabo -->
    <rect x="30" y="38" width="4" height="13" rx="2"/>
    <!-- Pescoço -->
    <rect x="30" y="28" width="4" height="12" rx="1"/>
    <!-- Dentes -->
    <rect x="27" y="18" width="2.2" height="12" rx="1"/>
    <rect x="31" y="18" width="2.2" height="12" rx="1"/>
    <rect x="35" y="18" width="2.2" height="12" rx="1"/>
  </g>
</svg>
