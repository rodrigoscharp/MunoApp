name: Testes

# O build da Vercel não roda vitest. Sem isto, a suíte só protege quem lembra
# de rodá-la, e as regras de src/security/ existem justamente para quem não
# lembra.
#
# push restrito a main: PR já roda pelo pull_request, e sem esse escopo cada
# PR rodava duas vezes (uma pelo push do branch, outra pelo próprio
# pull_request). push em main continua cobrindo commit direto, sem passar por
# PR.
on:
  push:
    branches: [main]
  pull_request:

# Menos do que o padrão do token do GITHUB_TOKEN, que é escrita. Este workflow
# só lê o repositório e roda testes; não empurra commit, não cria release, não
# comenta PR.
permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts porque o postinstall (scripts/fix-lightningcss.js)
      # instala binários de macOS, que aqui não servem e só atrasam. O único
      # passo do postinstall que os testes precisam é o client do Prisma.
      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      - run: npm run lint

      # vitest não checa tipos: só o build da Vercel o fazia, tarde demais.
      - run: npx tsc --noEmit
      - run: npm test

      # Reprova em high ou critical. Até 15/09/2026 este passo só avisava,
      # porque havia quatro high abertas e reprovar todo PR faria alguém
      # desligá-lo; elas foram fechadas (ver o `overrides` do package.json e o
      # AGENTS.md), e a partir daqui dependência nova com high não entra
      # calada. Moderate e low continuam aparecendo no log sem reprovar.
      - name: npm audit (reprova em high)
        run: npm audit --omit=dev --audit-level=high

  # Os testes de unidade mockam o Prisma, então nenhuma constraint única,
  # corrida ou policy de RLS passa por eles. Estes falam com um Postgres de
  # verdade (o mesmo major de produção), criado do zero com as migrações.
  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Senha descartável por execução, sem valor literal no arquivo.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: muno_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d muno_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_USUARIO: postgres
      PG_SENHA: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      # A URL é montada aqui, por partes, e não escrita inteira no arquivo:
      # usuário e senha literais numa URL de banco são o que varredores de
      # segredos leem como credencial vazada. src/test-integracao/banco.ts
      # recusa qualquer host que não seja local e qualquer banco sem "test" no
      # nome.
      - name: Apontar para o banco de teste
        run: echo "DATABASE_URL_TESTE=postgresql://${PG_USUARIO}:${PG_SENHA}@localhost:5432/muno_teste" >> "$GITHUB_ENV"

      # O globalSetup aplica `prisma migrate deploy` no banco de teste.
      - run: npm run test:integracao
